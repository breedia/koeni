<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f8f6f3">
<title>KOESELL | 運営管理</title>
<style>
:root{--ink:#242031;--line:#e5dfea;--violet:#6f52e9;--bg:#f8f6f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.6}
header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:960px;width:calc(100% - 32px);margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 0}
.brand{font-size:23px;letter-spacing:-.05em;font-weight:900}.brand small{display:block;font-size:12px;letter-spacing:0;color:#777;font-weight:500}
a{color:#6546ce}.back{font-size:13px;text-decoration:none}h1{font-size:26px;margin:24px 0 7px}
p{overflow-wrap:anywhere}.muted{color:#77718a;font-size:13px}.warning{padding:13px 16px;background:#eeeafb;border-radius:12px;font-size:13px;margin:12px 0}
.status{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
button{border:0;border-radius:10px;background:var(--violet);color:white;padding:10px 14px;font-weight:700;cursor:pointer;font-size:13px}
button:disabled{opacity:.5}button.light{background:#fff;border:1px solid var(--line);color:#554973}
button.danger{background:#b83245}button.secondary{background:#eae6f9;color:#5e45a4}
section{margin:24px 0}.stack{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--line);padding:16px;border-radius:14px}
.card p{white-space:pre-wrap;font-size:14px;margin:8px 0}
.card .meta{color:#756f7d;font-size:12px}
.card .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.code{font:11px ui-monospace,monospace;overflow-wrap:anywhere;color:#777}
.pill{padding:3px 8px;border-radius:20px;background:#efecf9;font-size:11px;font-weight:700}
h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:7px}
.empty{background:#fff;padding:18px;border-radius:12px;color:#7b7487}
footer{padding:30px 0;color:#888;font-size:12px}
@media(max-width:520px){h1{font-size:22px}.card{padding:12px}.top .brand{font-size:19px}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand">KOESELL<small>運営管理ツール</small></div>
  <a class="back" href="./">← サイトに戻る</a>
</div></header>
<main class="wrap">
  <h1>通報・不正検知・アカウント管理</h1>
  <p class="muted">このページは登録済みの運営者のみ利用できます。管理権限はサーバー側で検証されます。</p>
  <div id="status" class="status" role="status" aria-live="polite">ログイン状態と管理権限を確認しています…</div>
  <div id="adminPanel" hidden>
    <div class="warning">キーワード検知は参考情報です。違反の事実確認なしにBANしないでください。メッセージは調査目的に限定して取り扱ってください。</div>
    <div class="row">
      <p id="updatedAt" class="muted"></p>
      <button type="button" id="refresh" class="secondary">最新の情報に更新</button>
    </div>
    <section><h2>メッセージの通報 <span class="pill" id="msgReportCount">0</span></h2><div id="messageReports" class="stack"></div></section>
    <section><h2>自動検知したメッセージ <span class="pill" id="flagCount">0</span></h2><div id="flaggedMessages" class="stack"></div></section>
    <section><h2>出品への通報 <span class="pill" id="listingReportCount">0</span></h2><div id="listingReports" class="stack"></div></section>
    <section><h2>利用停止中のアカウント <span class="pill" id="banCount">0</span></h2><div id="bans" class="stack"></div></section>
  </div>
</main>
<footer class="wrap">KOESELL / 管理権限のある運営者のみ。本人の権利とプライバシーに配慮してください。</footer>
<script type="module" src="admin.js?v=20261021-v06"></script>
</body></html>
