<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOENI | パスワード再設定</title>
</head>
<body style="margin:0;padding:32px 12px;background:#f8f6f3;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:#23202e;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:540px;margin:0 auto;">
    <tr><td style="text-align:center;padding:12px 0 24px;">
      <span style="font-size:30px;font-weight:800;letter-spacing:-1px;color:#6245da;">KOENI</span>
      <div style="font-size:12px;color:#777581;margin-top:3px;">声のマーケットプレイス</div>
    </td></tr>
    <tr><td style="background:#ffffff;border:1px solid #eae6ef;border-radius:18px;padding:32px 25px;">
      <h1 style="margin:0 0 18px;font-size:23px;line-height:1.45;color:#242033;">パスワード再設定</h1>
      <p style="font-size:15px;line-height:1.9;margin:0 0 24px;color:#4a4656;">KOENIアカウントのパスワード再設定がリクエストされました。以下のボタンを押し、新しいパスワードを設定してください。</p>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 22px;width:100%;">
        <tr><td style="text-align:center;background:#6f52e9;border-radius:12px;">
          <a href="{{ .ConfirmationURL }}" style="display:block;padding:15px 16px;font-size:15px;line-height:1.5;color:#ffffff;font-weight:700;text-decoration:none;">パスワードを再設定する</a>
        </td></tr>
      </table>
      <p style="font-size:12px;line-height:1.8;color:#777581;margin:0;">再設定をリクエストしていない場合は、このメールを無視してください。</p>
    </td></tr>
    <tr><td style="text-align:center;padding:20px 8px;font-size:12px;line-height:1.7;color:#777581;">KOENIからの自動送信メールです。<br>https://koeni.netlify.app/</td></tr>
  </table>
</body>
</html>
